apiVersion: v1
kind: ServiceAccount
metadata:
  name: opentracing-agent-${namespace}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opentracing-agent-namespaced
  namespace: ${namespace}
rules:
  # get: logs-cleanup.sh (own pod readiness)
  # list: util.sh get_pod_ip/wait_for_pod, otel.sh wait_for_container_id
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # list: instagoric-server getServices
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["list"]
  # get: instagoric-server docker image lookup
  # list, patch: restart-pods.sh rollout restart
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opentracing-agent-namespaced
  namespace: ${namespace}
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: Role
  name: opentracing-agent-namespaced
subjects:
  - kind: ServiceAccount
    name: opentracing-agent-${namespace}
    namespace: ${namespace}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: opentracing-agent-kubelet
rules:
  # otel collector: kubeletstats receiver (/stats/summary) and
  # kubelet-cadvisor prometheus scrape (/metrics/cadvisor) on port 10250
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/stats"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opentracing-agent-kubelet-${namespace}
roleRef:
  apiGroup: "rbac.authorization.k8s.io"
  kind: ClusterRole
  name: opentracing-agent-kubelet
subjects:
  - kind: ServiceAccount
    name: opentracing-agent-${namespace}
    namespace: ${namespace}
